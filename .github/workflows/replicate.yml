name: replicate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  package-integrity:
    name: Package integrity (clean-venv load + data checks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Create clean virtual environment + install
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pipeline state smoke (build.py status)
        run: |
          . .venv/bin/activate
          python build.py status

      - name: Package integrity (registry + shipped data CSVs)
        run: |
          . .venv/bin/activate
          python tests/ci_smoke.py

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-state
          path: |
            PIPELINE_STATE.json
            VALIDATION_REPORT.json
          if-no-files-found: ignore
